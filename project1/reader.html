<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <nav class="navbar">
      <div class="logo">Project Translation</div>
      <div class="nav-controls">
        <button id="toggle-ebook" class="ebook-icon-btn" style="display:none;" aria-label="Toggle reading mode" title="Ganti mode baca">
  <!-- Ikon Mode Scroll (default, tampil saat tidak dalam mode ebook) -->
  <svg class="icon-scroll" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <!-- Kotak dengan panah bawah -->
    <rect x="4" y="3" width="16" height="18" rx="1" />
    <path d="M12 8v5M8 12l4 4 4-4" />
  </svg>
  <!-- Ikon Mode E-Book (muncul saat mode ebook aktif) -->
  <svg class="icon-ebook" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <!-- Kotak dengan panah kiri dan kanan -->
    <rect x="4" y="3" width="16" height="18" rx="1" />
    <path d="M8 12H6m2-3l-2 3 2 3" />
    <path d="M16 12h2m-2-3l2 3-2 3" />
  </svg>
</button>
        
      </div>
    </nav>
    <!-- Progress bar -->
<div class="reading-progress-container">
  <div class="reading-progress-bar" id="readingProgressBar"></div>
</div>
  </header>
  
  <!-- Konten Reader -->
  <main class="reader-container">
    <div class="chapter-title">
      <h1 id="chapter-title">Loading...</h1>
      
    </div>

    <!-- Gambar Chapter (scrolling vertikal) -->
    <div class="chapter-images" id="chapter-images">
    </div>

    <!-- Navigasi Chapter ◀ Prev -->
    <div class="chapter-navigation">
       <a href="#" id="prev-chapter" class="nav-btn">◀ Chapter</a>
      <a href="#" id="nav-home" class="nav-btn">Home</a>
      <a href="#" id="next-chapter" class="nav-btn">Chapter ▶</a>
    </div>
  </main>

  <script src="reader.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js')
        .then(registration => {
          console.log('Service Worker terdaftar dengan scope:', registration.scope);
        })
        .catch(error => {
          console.log('Pendaftaran Service Worker gagal:', error);
        });
    });
    }
  </script>
</body>
</html>
