<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">New Normal</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>

<!-- Tombol Kembali (Tetap dipertahankan) -->
<a href="../../index.html" class="back-area" id="metu"></a>

<!-- Header -->
<header>
  <nav class="navbar">
   <div class="logo">Project Translation</div>
  </nav>
</header>

<!-- Konten Detail Manga -->
<section class="manga-detail-container">
  <div class="manga-detail-card">
    
    <!-- 1. Cover (Area Kiri Desktop / Kiri Mobile) -->
    <div class="manga-cover">
      <img id="manga-cover" src="" alt="">
    </div>

    <!-- 2. Judul (Area Kanan Desktop / Kanan Mobile) -->
    <div class="manga-title">
      <h2 id="manga-title">New Normal</h2>
    </div>

    <!-- 3. Sinopsis (Area Kanan Bawah Desktop / Bawah Full Mobile) -->
    <div class="manga-synopsis">
      <p id="manga-synopsis" class="synopsis">
      </p>
    </div>

    <!-- 4. Daftar Chapter (Area Bawah Full) -->
    <div class="manga-chapters">
      <h3>Chapter List</h3>
      <ul id="chapter-list" class="chapter-list">
      
      </ul>
    </div>

  </div>
</section>

<script>
  console.log(" Script Manga Detail Mulai Jalan");

  const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
  const urlParams = new URLSearchParams(window.location.search);
  const mangaId = urlParams.get('id');

  console.log("🔍 ID dari URL:", mangaId);

  if (!mangaId) {
    console.error("❌ ID Manga kosong!");
    alert('ID manga tidak ditemukan!');
    window.location.href = '../../index.html';
  } else {
    fetch(`${BASE_URL}/manga.json`)
      .then(res => {
        console.log("📡 Status Response:", res.status);
        return res.json();
      })
      .then(data => {
        console.log(" Data JSON Berhasil Diambil:", data);
        console.log("🔑 Key di JSON:", Object.keys(data));
        
        const manga = data[mangaId];
        console.log("📖 Data Manga Ditemukan:", manga);

        if (!manga) {
          alert(`Manga dengan ID "${mangaId}" tidak ditemukan di JSON!`);
          return;
        }

        // Update Cover
        const cover = document.getElementById('manga-cover');
        if(cover) {
            cover.src = `${BASE_URL}/${mangaId}/${manga.prefix}.png`;
            console.log("🖼️ Cover diupdate");
        }

        // Update Judul
        const title = document.getElementById('manga-title');
        const pageTitle = document.getElementById('page-title');
        if(title) title.textContent = manga.title || mangaId;
        if(pageTitle) pageTitle.textContent = manga.title || mangaId;

        // Update Synopsis (PENTING)
        const synopsisEl = document.getElementById('manga-synopsis');
        console.log("🔍 Elemen Synopsis ditemukan:", synopsisEl);
        
        if (synopsisEl) {
          // Cek apakah ada teks synopsis
          const text = manga.synopsis || "Tidak ada sinopsis.";
          console.log(" Teks Synopsis:", text);
          synopsisEl.textContent = text;
        }

        // Update Chapter List
        const listContainer = document.getElementById('chapter-list');
        if (listContainer && manga.chapters) {
          listContainer.innerHTML = '';
          const sortedChapters = Object.keys(manga.chapters).sort((a, b) => a - b);
          sortedChapters.forEach(ch => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `../reader.html?manga=${mangaId}&chapter=${ch}`;
            a.textContent = `Chapter ${ch}`;
            li.appendChild(a);
            listContainer.appendChild(li);
          });
          console.log(`📚 Berhasil load ${sortedChapters.length} chapter`);
        }
      })
      .catch(err => {
        console.error("❌ GAGAL FETCH DATA:", err);
        alert("Gagal mengambil data manga. Cek Console untuk detail.");
      });
  }
</script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('Service Worker terdaftar dengan scope:', registration.scope);
        })
        .catch(error => {
          console.log('Pendaftaran Service Worker gagal:', error);
        });
    });
  }
  </script>
</body>
</html>
