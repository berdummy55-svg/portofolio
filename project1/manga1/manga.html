<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">New Normal</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>

<!-- Tombol Kembali (Tetap dipertahankan) -->
<a href="../../index.html" class="back-area" id="metu"></a>

<!-- Header -->
<header>
  <nav class="navbar">
   <div class="logo">Project Translation</div>
  </nav>
</header>

<!-- Konten Detail Manga -->
<section class="manga-detail-container">
  <div class="manga-detail-card">
    
    <!-- 1. Cover (Area Kiri Desktop / Kiri Mobile) -->
    <div class="manga-cover">
      <img id="manga-cover" src="" alt="">
    </div>

    <!-- 2. Judul (Area Kanan Desktop / Kanan Mobile) -->
    <div class="manga-title">
      <h1 id="manga-title">New Normal</h1>
    </div>

    <!-- 3. Sinopsis (Area Kanan Bawah Desktop / Bawah Full Mobile) -->
    <div class="manga-synopsis">
      <p id="manga-synopsis" class="synopsis">
      </p>
    </div>

    <!-- 4. Daftar Chapter (Area Bawah Full) -->
    <div class="manga-chapters">
      <h3>Chapter List</h3>
      <ul id="chapter-list" class="chapter-list">
      
      </ul>
    </div>

  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const mangaId = urlParams.get('id');
    
    console.log('🔍 Manga ID:', mangaId);
    
    if (!mangaId) {
      alert('ID manga tidak ditemukan!');
      window.location.href = '../../index.html';
      return;
    }
    
    fetch(`${BASE_URL}/manga.json`)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        console.log('✅ Data loaded');
        const manga = data[mangaId];
        
        if (!manga) {
          console.error('❌ Manga tidak ditemukan:', mangaId);
          alert('Manga tidak ditemukan!');
          return;
        }
        
        // Safe update elements (cek dulu apakah elemen ada)
        const cover = document.getElementById('manga-cover');
        if (cover) {
          cover.src = `${BASE_URL}/${mangaId}/${manga.prefix}.png`;
        }
        
        const title = document.getElementById('manga-title');
        if (title) title.textContent = manga.title || mangaId;
        
        const pageTitle = document.getElementById('page-title');
        if (pageTitle) pageTitle.textContent = manga.title || mangaId;
        
        const synopsis = document.getElementById('manga-synopsis');
        if (synopsis) {
          synopsis.textContent = manga.synopsis ? manga.synopsis.replace(/^"/, '') : 'Tidak ada sinopsis.';
        }
        
        // Generate chapter list
        const listContainer = document.getElementById('chapter-list');
        if (listContainer) {
          listContainer.innerHTML = '';
          const chapters = manga.chapters || {};
          const sorted = Object.keys(chapters).sort((a, b) => a - b);
          
          sorted.forEach(ch => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `../reader.html?manga=${mangaId}&chapter=${ch}`;
            a.textContent = `Chapter ${ch}`;
            li.appendChild(a);
            listContainer.appendChild(li);
          });
        }
      })
      .catch(err => {
        console.error('❌ Error:', err);
        alert('Gagal memuat manga: ' + err.message);
      });
  });
</script>
</body>
</html>
