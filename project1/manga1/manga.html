<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title"></title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <a href="../../index.html" class="back-area" id="metu"></a>

    <header>
      <nav class="navbar">
        <div class="logo">Project Translation</div>
      </nav>
    </header>

    <section class="manga-detail-container">
      <div class="manga-detail-card">
        <div class="manga-cover">
          <img id="manga-cover" src="" alt="" />
        </div>
        <div class="manga-title">
          <h1 id="manga-title"></h1>
        </div>
        <div class="manga-synopsis">
          <p id="manga-synopsis" class="synopsis"></p>
        </div>
        <div class="manga-chapters">
          <h3>Chapter List</h3>
          <ul id="chapter-list" class="chapter-list"></ul>
        </div>
      </div>
    </section>

    <script>
      const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
      const urlParams = new URLSearchParams(window.location.search);
      const mangaId = urlParams.get("id");

      if (!mangaId) {
        alert("ID manga tidak ditemukan!");
        window.location.href = "../../index.html";
      }

      async function loadMangaDetail() {
        try {
          const res = await fetch(`${BASE_URL}/manga.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          const manga = data[mangaId];

          if (!manga) {
            alert(`Manga dengan ID "${mangaId}" tidak ditemukan!`);
            return;
          }

          // Update Cover
          const cover = document.getElementById("manga-cover");
          if (cover) {
            cover.src = `${BASE_URL}/${mangaId}/${manga.prefix}.png`;
          }

          // Update Title
          const titleEl = document.getElementById("manga-title");
          const pageTitle = document.getElementById("page-title");
          const title = manga.title || mangaId;
          if (titleEl) titleEl.textContent = title;
          if (pageTitle) pageTitle.textContent = title;

          // Update Synopsis
          const synopsisEl = document.getElementById("manga-synopsis");
          if (synopsisEl) {
            synopsisEl.textContent = manga.synopsis || "Tidak ada sinopsis.";
          }

          // Update Chapter List
          const listContainer = document.getElementById("chapter-list");
          if (listContainer && manga.chapters) {
            const readData = localStorage.getItem(`readChapters_${mangaId}`);
            const readChapters = readData ? readData.split(",") : [];


            //SORT CHAPTER
            function sortChapters(a, b) {
    const [chA, partA] = String(a).split('.').map(Number);
    const [chB, partB] = String(b).split('.').map(Number);
    if (chA !== chB) return chA - chB;
    const pA = isNaN(partA) ? 0 : partA;
    const pB = isNaN(partB) ? 0 : partB;
    return pA - pB;
}

const sortedChapters = Object.keys(manga.chapters).sort(sortChapters);

            listContainer.innerHTML = sortedChapters
              .map((ch) => {
                const isRead = readChapters.includes(ch);
                return `
          <li class="${isRead ? "read" : ""}">
            <a href="../reader.html?manga=${mangaId}&chapter=${ch}">
              Chapter ${ch}
            </a>
          </li>
        `;
              })
              .join("");
          }
        } catch (err) {
          console.error("Gagal memuat detail manga:", err);
          alert("Gagal mengambil data manga.");
        }
      }

      loadMangaDetail();
    </script>
  </body>
</html>
