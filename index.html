<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Translation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
   <div class="logo">Project Translation</div>
  </nav>
</header>

<section class="manga-container" id="manga-list">

  <!-- Baris 1 (horizontal 7) -->

</section>

<script>
  const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
  const container = document.getElementById('manga-list');

  fetch(`${BASE_URL}/manga.json`)
    .then(res => res.json())
    .then(data => {
      // Kosongkan container dulu
      container.innerHTML = '';
      
      // Loop setiap manga
      Object.keys(data).forEach(id => {
        const manga = data[id];
        
        // Buat elemen <a> dengan class manga-card (PENTING untuk CSS!)
        const link = document.createElement('a');
        link.href = `project1/manga1/manga.html?id=${id}`;
        link.className = 'manga-card';  // ← Class ini WAJIB ada!
        
        // Buat elemen <img>
        const img = document.createElement('img');
        img.src = `${BASE_URL}/${id}/${manga.prefix}.png`;
        img.alt = manga.title || id;
        
        // Gabungkan
        link.appendChild(img);
        container.appendChild(link);
      });
    })
    .catch(err => console.error('Gagal load manga:', err));
</script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('Service Worker terdaftar dengan scope:', registration.scope);
        })
        .catch(error => {
          console.log('Pendaftaran Service Worker gagal:', error);
        });
    });
  }
</script>
</body>
</html>
