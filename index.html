<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga Translation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">Project Translation</div>
      </nav>
    </header>

    <div id="search-box-container">
      <input type="text" id="search-input" placeholder="Search..." />
    </div>

    <section class="manga-container" id="manga-list"></section>

    <script>
      const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
      const container = document.getElementById("manga-list");

      // --- Helper: Potong teks ---
      function truncate(str, max = 150) {
        return str && str.length > max
          ? str.substring(0, max) + "..."
          : str || "Tidak ada deskripsi.";
      }

      // --- Helper: Buat card HTML dari data manga ---
      function createMangaCard(id, manga) {
        const genres = manga.genre || manga.genres || ["Unknown"];
        const genreText = Array.isArray(genres) ? genres.join(" • ") : genres;
        const status = (manga.status || "unknown").toLowerCase();
        const chapters = manga.chapters || {};
        const keys = Object.keys(chapters);
        const latestChapter = keys.length > 0 ? keys[keys.length - 1] : "?";

        return `
    <a class="manga-item-wrapper" href="project1/manga1/manga.html?id=${id}">
      <img src="${BASE_URL}/${id}/${manga.prefix}.png" alt="${manga.title || id}">
      <div class="manga-card-content">
        <div class="manga-item-title">${manga.title || id}</div>
        <span class="manga-card-badge">${genreText}</span>
        <p class="manga-card-desc">${truncate(manga.synopsis)}</p>
        <div class="manga-card-meta">
          <span class="manga-card-status ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
          <span class="chapter-info">Last Release: Chapter ${latestChapter}</span>
        </div>
      </div>
    </a>
  `;
      }

      // --- Load & Render ---
      async function loadManga() {
        try {
          const res = await fetch(`${BASE_URL}/manga.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          container.innerHTML = Object.entries(data)
            .map(([id, manga]) => createMangaCard(id, manga))
            .join("");
        } catch (err) {
          container.innerHTML = `<p style="color:red;">Gagal memuat manga: ${err.message}</p>`;
          console.error("Gagal load manga:", err);
        }
      }

      loadManga();

      // --- Search ---
      document
        .getElementById("search-input")
        .addEventListener("input", function () {
          const keyword = this.value.toLowerCase();
          document.querySelectorAll(".manga-item-wrapper").forEach((item) => {
            const title = item
              .querySelector(".manga-item-title")
              .textContent.toLowerCase();
            item.style.display = title.includes(keyword) ? "flex" : "none";
          });
        });

      // --- Service Worker ---
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => console.log("Service Worker terdaftar:", reg.scope))
            .catch((err) => console.log("SW gagal:", err));
        });
      }
    </script>
  </body>
</html>
