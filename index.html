<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Translation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
   <div class="logo">Project Translation</div>
  </nav>
</header>

<div id="search-box-container">
    <input type="text" id="search-input" placeholder="Search...">
</div>

<section class="manga-container" id="manga-list">

  <!-- Baris 1 (horizontal 7) -->

</section>

<script>
  const BASE_URL = "https://pub-e8931c5705eb48b4b09534f5efbeacb9.r2.dev";
  const container = document.getElementById('manga-list');

  fetch(`${BASE_URL}/manga.json`)
    .then(res => res.json())
    .then(data => {
      // Kosongkan container dulu
      container.innerHTML = '';
      
      // Loop setiap manga
      Object.keys(data).forEach(id => {
        const manga = data[id];
        
        // Buat elemen <a> dengan class manga-card (PENTING untuk CSS!)
        const link = document.createElement('a');
        link.href = `project1/manga1/manga.html?id=${id}`;
        link.className = 'manga-card';  // ← Class ini WAJIB ada!
        
        // Buat elemen <img>
        const img = document.createElement('img');
        img.src = `${BASE_URL}/${id}/${manga.prefix}.png`;
        img.alt = manga.title || id;
        
        
        // 1. Buat wrapper baru agar layout tidak rusak
            const wrapper = document.createElement('div');
            wrapper.className = 'manga-item-wrapper';

        // 2. Masukkan img ke dalam link (sama seperti kode lama Anda)
            link.appendChild(img);

        // 3. Buat elemen Judul
            const titleDiv = document.createElement('div');
            titleDiv.className = 'manga-item-title';
            titleDiv.textContent = manga.title || id;

        // 4. Buat elemen Latest Chapter
            const chapterDiv = document.createElement('div');
            chapterDiv.className = 'manga-item-latest';
            const chapterKeys = Object.keys(manga.chapters);
        // Mengambil chapter paling akhir dari daftar
            const latestChapter = chapterKeys.length > 0 ? `Chapter ${chapterKeys[chapterKeys.length - 1]}` : 'Belum ada';
            chapterDiv.textContent = latestChapter;

        // 5. Gabungkan semuanya ke wrapper, lalu ke container utama
            wrapper.appendChild(link);
            wrapper.appendChild(titleDiv);
            wrapper.appendChild(chapterDiv);
            container.appendChild(wrapper);
      });
    })
  
    .catch(err => console.error('Gagal load manga:', err));
          // ===== FITUR SEARCH =====
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', function() {
    const keyword = this.value.toLowerCase();
    // Ambil semua wrapper manga yang sudah di-render
    const allItems = document.querySelectorAll('.manga-item-wrapper');

    allItems.forEach(item => {
        const title = item.querySelector('.manga-item-title').textContent.toLowerCase();
        // Jika judul mengandung kata kunci, tampilkan. Jika tidak, sembunyikan.
        if (title.includes(keyword)) {
            item.style.display = 'flex'; 
        } else {
            item.style.display = 'none'; 
        }
    });
});
    
</script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('Service Worker terdaftar dengan scope:', registration.scope);
        })
        .catch(error => {
          console.log('Pendaftaran Service Worker gagal:', error);
        });
    });
  }
</script>
</body>
</html>
